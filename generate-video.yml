name: Generate Long-Form Documentary\n\non:\n  workflow_dispatch:\n    inputs:\n      topic:\n        description: "Documentary topic"\n        required: true\n        type: string\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: documentary-generator\n  cancel-in-progress: false\n\njobs:\n  generate:\n    runs-on: ubuntu-latest\n    timeout-minutes: 60\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.11"\n\n      - name: Cache Whisper model\n        uses: actions/cache@v4\n        with:\n          path: ~/.cache/huggingface/hub\n          key: whisper-base-en-v1-${{ runner.os }}\n          restore-keys: |\n            whisper-base-en-v1-\n\n      - name: Install FFmpeg\n        run: sudo apt-get update && sudo apt-get install -y ffmpeg\n\n      - name: Install Node dependencies\n        run: npm install\n\n      - name: Install Python dependencies\n        run: pip install -r requirements.txt\n\n      - name: Generate 1080p60 documentary\n        env:\n          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}\n          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}\n          GEMINI_EDITOR_MODEL: ${{ secrets.GEMINI_EDITOR_MODEL }}\n          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}\n          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}\n          TTS_VOICE: en-US-GuyNeural\n          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}\n          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}\n        run: python scripts/generate.py --topic "${{ inputs.topic }}"\n\n      - name: Upload documentary\n        uses: actions/upload-artifact@v4\n        with:\n          name: documentary-video\n          path: |\n            out/*.mp4\n            public/runs/\n          if-no-files-found: error\n