name: Generate Documentary (Manual)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Documentary topic
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-base-en-v1-${{ runner.os }}
          restore-keys: |
            whisper-base-en-v1-

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate 1080p60 documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ secrets.GEMINI_EDITOR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_VOICE: en-US-GuyNeural
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/generate.py --topic "${{ inputs.topic }}"

      - name: Upload documentary
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video
          path: |
            out/*.mp4
            public/runs/
          if-no-files-found: error
