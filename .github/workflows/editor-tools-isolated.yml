name: Isolated FilmCraft and EffectCraft smoke tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - improve/filmcraft-visual-validation
    paths:
      - ".github/workflows/editor-tools-isolated.yml"
  pull_request:
    paths:
      - ".github/workflows/editor-tools-isolated.yml"

permissions:
  contents: read

concurrency:
  group: artcraft-isolated-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Jack Pockets
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Checkout FilmCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          path: filmcraft-src

      - name: Checkout EffectCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          path: effectcraft-src

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            filmcraft-src
            effectcraft-src

      - name: Build FilmCraft CLI
        working-directory: filmcraft-src
        run: cargo build --release -p filmcraft-cli

      - name: Build EffectCraft CLI
        working-directory: effectcraft-src
        run: cargo build --release -p effectcraft-cli

      - name: Export isolated demo previews
        run: |
          mkdir -p editor-tool-output
          ./filmcraft-src/target/release/filmcraft-cli --demo export editor-tool-output/filmcraft-demo.mp4 --start 0 --end 6 --allow-offline
          ./effectcraft-src/target/release/effectcraft-cli render --out editor-tool-output/effectcraft-demo.mp4 --format h264 --start 0 --end 6 --audio off

      - name: Verify preview files and video streams
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for path in [Path("editor-tool-output/filmcraft-demo.mp4"), Path("editor-tool-output/effectcraft-demo.mp4")]:
              if not path.is_file() or path.stat().st_size < 1000:
                  raise SystemExit(f"Missing or suspiciously small preview: {path}")
              data = json.loads(subprocess.check_output([
                  "ffprobe", "-v", "error", "-show_entries",
                  "format=duration,size:stream=codec_type,width,height",
                  "-of", "json", str(path)
              ]))
              kinds = {s.get("codec_type") for s in data.get("streams", [])}
              duration = float(data.get("format", {}).get("duration", 0))
              if "video" not in kinds or not 1 <= duration <= 8:
                  raise SystemExit(f"Invalid preview {path}: streams={kinds}, duration={duration}")
              print(f"PASS {path}: {duration:.2f}s, streams={sorted(kinds)}, bytes={path.stat().st_size}")
          PY

      - name: Upload previews and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-tools-isolated-previews
          path: editor-tool-output/
          if-no-files-found: warn
          retention-days: 7
