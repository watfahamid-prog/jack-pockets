name: Validate documentary pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q .
      - name: Run complete Python regression suite (no production API calls)
        run: python -m unittest discover -s tests -v
      - name: Typecheck Remotion
        run: npm run typecheck
      # Temporary one-run bridge; remove after this validation workflow completes.
      - name: Dispatch one-time documentary verification
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[dispatch-documentary-verification]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run generate-video.yml --ref main -f topic="The 1997 AS 7007 Internet Routing Incident: How One Router Disrupted Internet Traffic"
