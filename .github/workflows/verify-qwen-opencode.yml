name: Verify Qwen and OpenCode (experimental)

on:
  push:
    branches: [main, verify-qwen-opencode]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic for the Qwen documentary-plan smoke test"
        required: true
        type: string
        default: "What Is the Most Expensive Thing Ever?"

permissions:
  contents: read

concurrency:
  group: qwen-opencode-verification
  cancel-in-progress: true

jobs:
  verify-local-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OLLAMA_CONTEXT_LENGTH: "16384"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install minimal Qwen smoke-test dependencies
        run: python -m pip install -r requirements-qwen.txt

      - name: Install Ollama and start local service
        id: ollama_setup
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh -o "$RUNNER_TEMP/ollama-install.sh"
          if ! timeout 240s sh "$RUNNER_TEMP/ollama-install.sh"; then
            echo "Ollama installation failed or exceeded the 4-minute setup budget." >&2
            exit 1
          fi
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 & echo $! > "$RUNNER_TEMP/ollama.pid")
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --silent --fail http://127.0.0.1:11434/api/tags
          ollama --version

      - name: Download Qwen model
        run: ollama pull qwen3:4b

      - name: Run cheap Qwen final-text probe
        env:
          QWEN_BASE_URL: http://127.0.0.1:11434/v1
          QWEN_MODEL: qwen3:4b
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/qwen-response-probe.log"
          import json, os, urllib.request
          base = os.environ["QWEN_BASE_URL"].split("/v1", 1)[0].rstrip("/")
          payload = {
              "model": os.environ["QWEN_MODEL"],
              "messages": [
                  {"role": "system", "content": "Be concise. Do not explain."},
                  {"role": "user", "content": "Reply with exactly: QWEN_OK"},
                  {"role": "assistant", "content": "<think>\n\n</think>\n\n"},
              ],
              "stream": False, "think": False,
              "options": {"temperature": 0, "num_predict": 32, "num_ctx": 2048},
          }
          req = urllib.request.Request(base + "/api/chat", data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(req, timeout=180) as response:
              result = json.loads(response.read().decode())
          msg = result.get("message") or {}
          content = msg.get("content") or ""
          metadata = {key: result.get(key) for key in ("model", "done", "done_reason", "prompt_eval_count", "eval_count")}
          metadata.update({"content_chars": len(content), "thinking_chars": len(msg.get("thinking") or ""),
                          "message_keys": sorted(msg.keys())})
          print("QWEN_PROBE_METADATA=" + json.dumps(metadata, sort_keys=True))
          print("QWEN_PROBE_CONTENT=" + repr(content[:160]))
          if content.strip() != "QWEN_OK" or result.get("done_reason") == "length":
              raise SystemExit("Qwen short probe failed: expected exact final text QWEN_OK without truncation")
          print("Qwen short probe passed with exact final text.")
          PY

      - name: Run real Qwen documentary-plan smoke test
        id: qwen_smoke
        env:
          LLM_PROVIDER: qwen
          QWEN_BASE_URL: http://127.0.0.1:11434/v1
          QWEN_MODEL: qwen3:4b
          QWEN_API_KEY: ollama
          QWEN_TIMEOUT_SECONDS: "1800"
          QWEN_MAX_TOKENS: "4000"
        run: |
          set -o pipefail
          timeout 35m python qwen_smoke_test.py --topic "${{ inputs.topic || 'What Is the Most Expensive Thing Ever?' }}" --output out/qwen-smoke-test-plan.json 2>&1 | tee "$RUNNER_TEMP/qwen-smoke-test.log"

      - name: Install OpenCode CLI
        if: always() && steps.ollama_setup.conclusion == 'success'
        run: npm install --global opencode-ai

      - name: Verify OpenCode can use local Qwen and make a test change
        if: steps.ollama_setup.conclusion == 'success' && steps.qwen_smoke.conclusion == 'success'
        shell: bash
        env:
          OLLAMA_HOST: http://127.0.0.1:11434
        run: |
          set -euo pipefail
          SANDBOX="$RUNNER_TEMP/opencode-sandbox"
          mkdir -p "$SANDBOX"
          cd "$SANDBOX"
          opencode --version | tee "$RUNNER_TEMP/opencode-version.log"
          set +e
          timeout 15m opencode run --model ollama/qwen3:4b "In this empty test workspace, create exactly one file named verification.py. It must define a function add(a, b) returning a+b and include a small main guard that prints add(2, 3). Do not modify files outside this workspace. Then stop." 2>&1 | tee "$RUNNER_TEMP/opencode-run.log"
          OPENCODE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$OPENCODE_STATUS" -ne 0 ]; then
            echo "OpenCode exited with status $OPENCODE_STATUS" >&2
            exit "$OPENCODE_STATUS"
          fi
          test -f verification.py
          python verification.py | tee "$RUNNER_TEMP/opencode-test.log"
          grep -qx "5" "$RUNNER_TEMP/opencode-test.log"
          python -m py_compile verification.py
          echo "OpenCode successfully created and executed a test change with local Qwen."

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-opencode-verification-${{ github.run_number }}
          path: |
            out/qwen-smoke-test-plan.json
            ${{ runner.temp }}/qwen-smoke-test.log
            ${{ runner.temp }}/qwen-response-probe.log
            ${{ runner.temp }}/ollama.log
            ${{ runner.temp }}/opencode-version.log
            ${{ runner.temp }}/opencode-run.log
            ${{ runner.temp }}/opencode-test.log
          if-no-files-found: warn
          retention-days: 14
