name: Experimental FilmCraft demo export

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filmcraft-demo-export
  cancel-in-progress: false

jobs:
  demo-export:
    name: Export FilmCraft built-in demo (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Jack Pockets
        uses: actions/checkout@v4

      - name: Checkout FilmCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          path: filmcraft-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev ffmpeg

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: filmcraft-src

      - name: Build FilmCraft CLI
        working-directory: filmcraft-src
        run: cargo build --release -p filmcraft-cli

      - name: Inspect built-in demo project
        working-directory: filmcraft-src
        run: |
          mkdir -p ../filmcraft-demo-output
          ./target/release/filmcraft-cli --demo inspect > ../filmcraft-demo-output/demo-inspect.json

      - name: Export a low-resolution demo video
        working-directory: filmcraft-src
        timeout-minutes: 12
        run: |
          set -o pipefail
          ./target/release/filmcraft-cli --demo export ../filmcraft-demo-output/filmcraft-demo.mp4 --format h264 --range entire --scale 0.5 --quality 65 2>&1 | tee ../filmcraft-demo-output/export.log

      - name: Verify exported media
        if: always()
        run: |
          {
            echo "=== Export file ==="
            if [ -f filmcraft-demo-output/filmcraft-demo.mp4 ]; then
              ls -lh filmcraft-demo-output/filmcraft-demo.mp4
              ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,sample_rate,channels -of json filmcraft-demo-output/filmcraft-demo.mp4 | tee filmcraft-demo-output/media-probe.json
            else
              echo "No MP4 was produced."
              exit 1
            fi
          } 2>&1 | tee filmcraft-demo-output/verification.log

      - name: Upload demo and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-demo-export-${{ github.run_number }}
          path: filmcraft-demo-output/
          if-no-files-found: warn
          retention-days: 7
