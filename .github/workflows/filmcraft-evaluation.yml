name: Experimental FilmCraft compatibility check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filmcraft-isolated-evaluation
  cancel-in-progress: false

jobs:
  filmcraft-smoke-test:
    name: Build and inspect FilmCraft CLI (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Jack Pockets
        uses: actions/checkout@v4

      - name: Checkout FilmCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          path: filmcraft-src

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev ffmpeg

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: filmcraft-src

      - name: Record candidate version and license
        working-directory: filmcraft-src
        run: |
          git log -1 --format='commit=%H%nsubject=%s' > ../filmcraft-build-info.txt
          if [ -f LICENSE ]; then cp LICENSE ../filmcraft-license.txt; fi
          if [ -f LICENSE.md ]; then cp LICENSE.md ../filmcraft-license.txt; fi
          rustc --version >> ../filmcraft-build-info.txt
          cargo --version >> ../filmcraft-build-info.txt

      - name: Build FilmCraft CLI only
        working-directory: filmcraft-src
        run: cargo build --release -p filmcraft-cli

      - name: Smoke-test headless CLI without API keys or project changes
        working-directory: filmcraft-src
        run: |
          set -o pipefail
          ./target/release/filmcraft-cli --help 2>&1 | tee ../filmcraft-cli-help.txt
          ./target/release/filmcraft-cli commands 2>&1 | tee ../filmcraft-command-list.txt
          ./target/release/filmcraft-cli mcp --demo --help 2>&1 | tee ../filmcraft-mcp-help.txt || true
          test -s ../filmcraft-command-list.txt

      - name: Upload evaluation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-isolated-evaluation-${{ github.run_number }}
          path: |
            filmcraft-build-info.txt
            filmcraft-license.txt
            filmcraft-cli-help.txt
            filmcraft-command-list.txt
            filmcraft-mcp-help.txt
          if-no-files-found: warn
          retention-days: 7
