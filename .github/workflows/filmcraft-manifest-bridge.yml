name: Experimental FilmCraft manifest bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "filmcraft_bridge.py"
      - "tests/test_filmcraft_bridge.py"
      - "tests/validate_filmcraft_preview.py"
      - ".github/workflows/filmcraft-manifest-bridge.yml"

permissions:
  contents: read

concurrency:
  group: filmcraft-manifest-bridge
  cancel-in-progress: false

jobs:
  bridge-preview:
    name: Build a FilmCraft timeline from a Jack Pockets manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Jack Pockets
        uses: actions/checkout@v4

      - name: Checkout FilmCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          path: filmcraft-src

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev ffmpeg python3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: filmcraft-src

      - name: Test manifest bridge
        run: python3 -m unittest discover -s tests -p 'test_filmcraft_bridge.py' -v

      - name: Build FilmCraft CLI
        working-directory: filmcraft-src
        run: cargo build --release -p filmcraft-cli

      - name: Create synthetic Jack Pockets manifest and media
        run: |
          mkdir -p public/runs/filmcraft-bridge-test filmcraft-bridge-output
          ffmpeg -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=3" -f lavfi -i "sine=frequency=440:duration=3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest public/runs/filmcraft-bridge-test/clip-a.mp4
          ffmpeg -y -f lavfi -i "color=c=orange:size=640x360:rate=30:duration=3" -f lavfi -i "sine=frequency=660:duration=3" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest public/runs/filmcraft-bridge-test/clip-b.mp4
          ffmpeg -y -f lavfi -i "sine=frequency=220:duration=6" -c:a pcm_s16le public/runs/filmcraft-bridge-test/narration.wav
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = "runs/filmcraft-bridge-test/"
          manifest = {
              "title": "Jack Pockets FilmCraft bridge test",
              "topic": "FilmCraft bridge test",
              "duration": 6,
              "audioSrc": base + "narration.wav",
              "beats": [{
                  "id": "bridge-test-beat",
                  "start": 0,
                  "assets": [
                      {"id": "clip-a", "kind": "video", "src": base + "clip-a.mp4"},
                      {"id": "clip-b", "kind": "video", "src": base + "clip-b.mp4"}
                  ],
                  "shots": [
                      {"id": "shot-a", "start": 0, "end": 3, "assetIds": ["clip-a"], "layers": []},
                      {"id": "shot-b", "start": 3, "end": 6, "assetIds": ["clip-b"], "layers": []}
                  ]
              }]
          }
          Path("filmcraft-bridge-output/fixture-manifest.json").write_text(json.dumps(manifest, indent=2))
          PY

      - name: Create FilmCraft timeline and export preview
        run: |
          python3 filmcraft_bridge.py             --manifest filmcraft-bridge-output/fixture-manifest.json             --public-dir public             --output-dir filmcraft-bridge-output             --cli ./filmcraft-src/target/release/filmcraft-cli             --max-seconds 6

      - name: Verify exported media streams
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,codec_name,width,height,sample_rate,channels -of json filmcraft-bridge-output/filmcraft-manifest-preview.mp4 | tee filmcraft-bridge-output/export-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("filmcraft-bridge-output/export-probe.json").read_text())
          kinds = {stream.get("codec_type") for stream in data.get("streams", [])}
          duration = float(data.get("format", {}).get("duration", 0))
          if not {"video", "audio"}.issubset(kinds):
              raise SystemExit(f"Expected video and audio streams, got: {kinds}")
          if not 5.5 <= duration <= 7:
              raise SystemExit(f"Expected approximately six seconds, got {duration}s")
          print(f"Verified bridge preview: {duration:.2f}s with video and audio.")
          PY

      - name: Visual regression check (frame occupancy)
        run: python3 tests/validate_filmcraft_preview.py filmcraft-bridge-output/filmcraft-manifest-preview.mp4 filmcraft-bridge-output/visual-qa.json

      - name: Upload bridge preview and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filmcraft-manifest-bridge-preview
          path: filmcraft-bridge-output/
          if-no-files-found: warn
          retention-days: 7
