name: Generate Jack Pockets Style Documentary

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Original documentary topic"
        required: true
        type: string
        default: "The 1997 AS 7007 Internet Routing Incident: How One Router Disrupted Internet Traffic"

permissions:
  contents: read

concurrency:
  group: jack-pockets-documentary
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch'
    env:
      DOCUMENTARY_TOPIC: ${{ inputs.topic }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore reusable research, plans, and narration
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/jack-pockets
          # Each run gets a unique writable cache; restore the newest compatible cache first.
          key: jack-pockets-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jack-pockets-cache-${{ runner.os }}-

      - name: Install FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          elif timeout 90 sudo apt-get update && timeout 90 sudo apt-get install -y ffmpeg; then
            ffmpeg -version
          else
            python -m pip install imageio-ffmpeg
            mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
            FFMPEG_PATH="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
            ln -sf "$FFMPEG_PATH" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
            echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ffmpeg-bin/ffmpeg" -version
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate code and toolchain before using API quota
        run: |
          python --version
          node --version
          ffmpeg -version
          python -m compileall -q .
          python -m unittest discover -s tests -v
          npm run typecheck
          test -f generate.py
          test -f audio_aligner.py
          test -f index.tsx
          test -f JackPocketsVideo.tsx

      - name: Generate 1080p30 documentary
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ secrets.GEMINI_EDITOR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
          TTS_VOICE: en-US-GuyNeural
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MUSIC_URL: ${{ secrets.MUSIC_URL }}
          JACKPOCKETS_VIDEO_QC: "1"
        run: |
          set -o pipefail
          python generate.py --topic "$DOCUMENTARY_TOPIC" --assets-per-beat 2 2>&1 | tee "$RUNNER_TEMP/jack-pockets-generate.log"

      # Record objective run evidence into the reusable cache. This is the first
      # live feedback connection for Harness²; it never changes production settings.
      - name: Record Harness² run feedback
        if: always()
        run: |
          RUN_DIR="public/runs/$(python -c 'import re,sys; print(re.sub(r"[^a-z0-9]+", "-", sys.argv[1].lower()).strip("-")[:55] or "run")' "$DOCUMENTARY_TOPIC")"
          python harness2/record_run.py \
            --topic "$DOCUMENTARY_TOPIC" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --log "$RUNNER_TEMP/jack-pockets-generate.log" \
            --run-dir "$RUN_DIR" \
            --ledger "$HOME/.cache/jack-pockets/harness2/experience-ledger.json" \
            --report harness2-learning-report.json \
            --memory harness2-learning-memory.md
          python harness2/propose_improvements.py \
            --ledger "$HOME/.cache/jack-pockets/harness2/experience-ledger.json" \
            --memory harness2-learning-memory.md \
            --output harness2-learning-proposals.json
          python harness2/render_native_harness.py --output harness2/native --memory harness2-learning-memory.md

      # Save useful research/plan/audio cache entries even when the quality gate
      # rejects a run. Otherwise failed generation attempts never persist cache data.
      - name: Save reusable research, plans, and narration
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/jack-pockets
          key: jack-pockets-cache-${{ runner.os }}-${{ github.run_id }}

      - name: Upload documentary and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-pockets-documentary-${{ github.run_number }}
          path: |
            out/*.mp4
            public/runs/**/manifest.json
            public/runs/**/plan.json
            public/runs/**/research.json
            public/runs/**/render-props.json
            public/runs/**/alignment.json
            public/runs/**/video-qc.json
            public/runs/**/narration.mp3
            public/runs/**/music-bed.json
            harness2-learning-report.json
            harness2-learning-memory.md
            harness2-learning-proposals.json
            harness2/native/**
          if-no-files-found: warn
          retention-days: 14
