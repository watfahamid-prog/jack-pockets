name: Local Claude Code polish (Ollama)

on:
  # Run at 08:00 Stockholm local time in both CET and CEST; a local-time gate skips the other slot.
  schedule:
    - cron: "0 6,7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: local-ollama-claude-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: [self-hosted, Windows, X64, jack-pockets-ollama]
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ANTHROPIC_BASE_URL: http://127.0.0.1:11434
      ANTHROPIC_AUTH_TOKEN: ollama
      OLLAMA_CODING_MODEL: "${{ vars.OLLAMA_CODING_MODEL || 'gemma4:e2b-it-q4_K_M' }}"
    steps:
      - name: Gate schedule to 08:00 local time
        id: local_time_gate
        shell: powershell
        run: |
          $proceed = $true
          if ("${{ github.event_name }}" -eq "schedule" -and (Get-Date).Hour -ne 8) {
            $proceed = $false
            Write-Host "Skipping this UTC schedule slot; the laptop's local time is not 08:00."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "proceed=$($proceed.ToString().ToLowerInvariant())"

      - name: Check out main
        if: steps.local_time_gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify local Ollama, selected model, Claude Code and Git Bash
        if: steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tags = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 10
          $modelNames = @($tags.models | ForEach-Object { $_.name })
          if ($modelNames -notcontains $env:OLLAMA_CODING_MODEL) {
            throw "Ollama model '$env:OLLAMA_CODING_MODEL' is not installed. Install it on this runner or set repository variable OLLAMA_CODING_MODEL to a local model that is already installed."
          }
          $claude = Get-Command claude.cmd -ErrorAction SilentlyContinue
          if (-not $claude) {
            $candidate = Join-Path $env:APPDATA "npm\claude.cmd"
            if (Test-Path -LiteralPath $candidate) { $claudePath = $candidate }
            else { throw "Claude Code CLI was not found for the Windows account running the GitHub runner." }
          } else { $claudePath = $claude.Source }
          $gitBashCandidates = @("C:\Program Files\Git\bin\bash.exe", "C:\Program Files (x86)\Git\bin\bash.exe")
          $gitBash = $gitBashCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $gitBash) { throw "Git Bash was not found; install Git for Windows for the runner account." }
          Write-Host "Local Ollama, model, Claude Code CLI and Git Bash were found."

      - name: Set up Node.js
        if: steps.local_time_gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        if: steps.local_time_gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies for checks
        if: steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed." }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Python dependency installation failed." }

      - name: Let Claude Code inspect and improve the repository
        if: steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $claude = Get-Command claude.cmd -ErrorAction SilentlyContinue
          if (-not $claude) { $claudePath = Join-Path $env:APPDATA "npm\claude.cmd" } else { $claudePath = $claude.Source }
          $gitBash = @("C:\Program Files\Git\bin\bash.exe", "C:\Program Files (x86)\Git\bin\bash.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $gitBash) { throw "Git Bash is unavailable." }
          $env:CLAUDE_CODE_GIT_BASH_PATH = $gitBash
          $prompt = Get-Content ".github/prompts/claude-code-local-polish.md" -Raw
          $log = Join-Path $env:RUNNER_TEMP "claude-code-agent.log"
          & $claudePath -p --model $env:OLLAMA_CODING_MODEL --dangerously-skip-permissions --max-turns 24 $prompt 2>&1 | Tee-Object -FilePath $log
          $agentExitCode = $LASTEXITCODE
          if ($agentExitCode -ne 0) { throw "Claude Code returned exit code $agentExitCode. See the uploaded run log." }

      - name: Verify changes and allow up to two repair passes
        if: steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $claude = Get-Command claude.cmd -ErrorAction SilentlyContinue
          if (-not $claude) { $claudePath = Join-Path $env:APPDATA "npm\claude.cmd" } else { $claudePath = $claude.Source }
          $gitBash = @("C:\Program Files\Git\bin\bash.exe", "C:\Program Files (x86)\Git\bin\bash.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $gitBash) { throw "Git Bash is unavailable." }
          $env:CLAUDE_CODE_GIT_BASH_PATH = $gitBash
          $checkLog = Join-Path $env:RUNNER_TEMP "jackpockets-checks.log"
          $agentLog = Join-Path $env:RUNNER_TEMP "claude-code-agent.log"

          function Invoke-Checks {
            $failures = @()
            Set-Content -Path $checkLog -Value "Python compileall"
            $output = & python -m compileall -q . 2>&1
            $code = $LASTEXITCODE
            $output | Add-Content -Path $checkLog
            if ($code -ne 0) { $failures += "Python compileall" }

            "Python unit tests" | Add-Content -Path $checkLog
            $output = & python -m unittest discover -s tests -v 2>&1
            $code = $LASTEXITCODE
            $output | Add-Content -Path $checkLog
            if ($code -ne 0) { $failures += "Python unit tests" }

            "TypeScript typecheck" | Add-Content -Path $checkLog
            $output = & npm run typecheck 2>&1
            $code = $LASTEXITCODE
            $output | Add-Content -Path $checkLog
            if ($code -ne 0) { $failures += "TypeScript typecheck" }

            "Caption tests" | Add-Content -Path $checkLog
            $output = & npm run test:captions 2>&1
            $code = $LASTEXITCODE
            $output | Add-Content -Path $checkLog
            if ($code -ne 0) { $failures += "Caption tests" }

            "Git whitespace check" | Add-Content -Path $checkLog
            $output = & git diff --check 2>&1
            $code = $LASTEXITCODE
            $output | Add-Content -Path $checkLog
            if ($code -ne 0) { $failures += "git diff --check" }
            return $failures
          }

          $passed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            "Check attempt $attempt" | Add-Content -Path $checkLog
            $failures = @(Invoke-Checks)
            if ($failures.Count -eq 0) {
              $passed = $true
              "All required checks passed on attempt $attempt." | Add-Content -Path $checkLog
              break
            }
            "Failed checks: $($failures -join ', ')" | Add-Content -Path $checkLog
            if ($attempt -lt 3) {
              $failureDetails = Get-Content $checkLog -Raw
              $repairPrompt = @"
The current Jack Pockets patch failed verification. Fix the actual root cause with a narrow change.
Do not edit tests, dependency manifests, workflow files, prompts, CLAUDE.md or runner setup.
Do not weaken or delete checks. Do not run documentary generation or call external provider APIs.
After fixing, stop and let the workflow re-run the checks.

Verification log:
$failureDetails
"@
              & $claudePath -p --model $env:OLLAMA_CODING_MODEL --dangerously-skip-permissions --max-turns 16 $repairPrompt 2>&1 | Tee-Object -FilePath $agentLog -Append
              $agentExitCode = $LASTEXITCODE
              if ($agentExitCode -ne 0) { throw "Claude Code repair pass failed with exit code $agentExitCode." }
            }
          }
          if (-not $passed) { throw "Required checks still fail after two repair passes. No changes will be merged." }

      - name: Publish only a verified source-code patch
        if: steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($status.Count -eq 0) {
            Write-Host "No evidence-backed code changes were needed. Nothing to commit or merge."
            exit 0
          }
          $paths = @($status | ForEach-Object { $_.Substring(3).Trim('"') })
          $notSource = @($paths | Where-Object { $_ -notmatch '\.(py|ts|tsx|js|mjs|jsx|cjs|css|html)$' })
          if ($notSource.Count -gt 0) {
            throw "Refusing to publish non-source/configuration changes from the local agent: $($notSource -join ', ')"
          }
          $blocked = @($paths | Where-Object {
            $_ -match '^\.github/' -or
            $_ -eq 'CLAUDE.md' -or
            $_ -match '^tests/' -or
            $_ -eq 'package.json' -or
            $_ -eq 'package-lock.json' -or
            $_ -match '^requirements[^/]*\.txt$' -or
            $_ -eq 'scripts/setup-local-coding-agents.ps1'
          })
          if ($blocked.Count -gt 0) {
            throw "Refusing to publish agent changes to protected workflows, instructions, tests or dependency files: $($blocked -join ', ')"
          }
          git config user.name "jack-pockets-local-agent"
          git config user.email "jack-pockets-local-agent@users.noreply.github.com"
          $branch = "agent/local-ollama-polish-$env:GITHUB_RUN_NUMBER"
          git checkout -b $branch
          if ($LASTEXITCODE -ne 0) { throw "Could not create the isolated agent branch." }
          git add --all
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Staged changes failed git diff --check." }
          git commit -m "chore: verified local Ollama code polish"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit the verified improvement." }
          $headSha = (git rev-parse HEAD).Trim()
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { throw "Could not push the agent branch." }

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $prPayload = @{
            title = "Verified local Ollama code improvement"
            head = $branch
            base = "main"
            body = "Local Claude Code + Ollama improvement. Python compilation, unit tests, typecheck, caption tests and diff checks passed in workflow run $env:GITHUB_RUN_ID. The agent is blocked from editing workflows, instructions, tests, dependency manifests or runner setup."
          } | ConvertTo-Json
          $pr = Invoke-RestMethod -Method Post -Uri "$repo/pulls" -Headers $headers -ContentType "application/json" -Body $prPayload
          Write-Host "Created PR #$($pr.number): $($pr.html_url)"
          try {
            $mergePayload = @{
              merge_method = "squash"
              sha = $headSha
              commit_title = "chore: verified local Ollama code polish"
              commit_message = "All required checks passed in self-hosted workflow run $env:GITHUB_RUN_ID."
            } | ConvertTo-Json
            $merge = Invoke-RestMethod -Method Put -Uri "$repo/pulls/$($pr.number)/merge" -Headers $headers -ContentType "application/json" -Body $mergePayload
            if (-not $merge.merged) { throw "GitHub did not confirm the merge." }
            Write-Host "Merged verified PR #$($pr.number) as $($merge.sha)."
          } catch {
            Write-Warning "PR #$($pr.number) passed local checks but could not be auto-merged by repository rules. It remains open; no unchecked changes were forced into main."
          }

      - name: Upload agent and verification logs
        if: always() && steps.local_time_gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: local-ollama-agent-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-code-agent.log
            ${{ runner.temp }}/jackpockets-checks.log
          if-no-files-found: ignore
          retention-days: 14
