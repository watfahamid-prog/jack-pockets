name: Daily read-only Claude Code audit (Ollama)

on:
  # Automatic execution is disabled in this public repository.
  # The scheduled local runner will live only in the private controller repository.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-claude-code-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, jack-pockets-ollama]
    timeout-minutes: 180
    env:
      ANTHROPIC_BASE_URL: http://127.0.0.1:11434
      ANTHROPIC_AUTH_TOKEN: ollama
      OLLAMA_CODING_MODEL: "${{ vars.OLLAMA_CODING_MODEL || 'gemma4:e2b-it-q4_K_M' }}"
    steps:
      - name: Gate schedule to 08:00 local time
        id: local_time_gate
        shell: powershell
        run: |
          $proceed = $true
          if ("${{ github.event_name }}" -eq "schedule" -and (Get-Date).Hour -ne 8) {
            $proceed = $false
            Write-Host "Skipping this UTC schedule slot; the runner's local time is not 08:00."
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "proceed=$($proceed.ToString().ToLowerInvariant())"

      - name: Check out the committed source
        if: steps.local_time_gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify local Ollama, model, Claude Code and Git Bash
        if: steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tags = Invoke-RestMethod -Uri "http://127.0.0.1:11434/api/tags" -TimeoutSec 10
          $modelNames = @($tags.models | ForEach-Object { $_.name })
          if ($modelNames -notcontains $env:OLLAMA_CODING_MODEL) {
            throw "Ollama model '$env:OLLAMA_CODING_MODEL' is not installed on this runner."
          }
          $claude = Get-Command claude.cmd -ErrorAction SilentlyContinue
          if (-not $claude) {
            $candidate = Join-Path $env:APPDATA "npm\claude.cmd"
            if (Test-Path -LiteralPath $candidate) { $claudePath = $candidate }
            else { throw "Claude Code CLI was not found for the runner account." }
          } else { $claudePath = $claude.Source }
          $gitBashCandidates = @("C:\Program Files\Git\bin\bash.exe", "C:\Program Files (x86)\Git\bin\bash.exe")
          $gitBash = $gitBashCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $gitBash) { throw "Git Bash was not found for the runner account." }
          Write-Host "Local Ollama, selected model, Claude Code CLI and Git Bash were found."

      - name: Prepare read-only review context outside the checkout
        if: steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $status = @(git status --porcelain --untracked-files=all)
          if ($status.Count -gt 0) {
            throw "Checkout was not clean before the audit: $($status -join '; ')"
          }
          $head = (git rev-parse HEAD).Trim()
          $history = (& git log -n 25 --date=short --pretty=format:"%h %ad %s" 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read recent commit history." }
          $files = @(git ls-files)
          if ($LASTEXITCODE -ne 0) { throw "Could not inventory tracked files." }
          $prompt = Get-Content ".github/prompts/claude-code-local-polish.md" -Raw
          $context = @"
          Read-only repository context (for review only)
          Checked-out commit: $head
          Repository: $env:GITHUB_REPOSITORY

          Recent committed history:
          $history

          Complete tracked-file inventory:
          $($files -join [Environment]::NewLine)
          "@
          $fullPrompt = $prompt + [Environment]::NewLine + [Environment]::NewLine + $context
          $promptPath = Join-Path $env:RUNNER_TEMP "claude-code-review-prompt.txt"
          Set-Content -Path $promptPath -Value $fullPrompt -Encoding utf8
          Write-Host "Prepared review context for $($files.Count) tracked files at commit $head."

      - name: Run Claude Code in enforced read-only mode
        if: steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $claude = Get-Command claude.cmd -ErrorAction SilentlyContinue
          if (-not $claude) { $claudePath = Join-Path $env:APPDATA "npm\claude.cmd" } else { $claudePath = $claude.Source }
          $gitBash = @("C:\Program Files\Git\bin\bash.exe", "C:\Program Files (x86)\Git\bin\bash.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $gitBash) { throw "Git Bash is unavailable." }
          $env:CLAUDE_CODE_GIT_BASH_PATH = $gitBash
          $promptPath = Join-Path $env:RUNNER_TEMP "claude-code-review-prompt.txt"
          $reportPath = Join-Path $env:RUNNER_TEMP "claude-code-review.md"
          $logPath = Join-Path $env:RUNNER_TEMP "claude-code-agent.log"
          $prompt = Get-Content $promptPath -Raw
          & $claudePath -p --model $env:OLLAMA_CODING_MODEL --permission-mode plan --allowedTools "Read" "Glob" "Grep" --disallowedTools "Edit" "Write" "Bash" "NotebookEdit" --max-turns 48 $prompt 2>&1 | Tee-Object -FilePath $logPath
          $agentExitCode = $LASTEXITCODE
          if ($agentExitCode -ne 0) { throw "Claude Code read-only audit exited with code $agentExitCode." }
          if (-not (Test-Path -LiteralPath $logPath) -or (Get-Item $logPath).Length -eq 0) {
            throw "Claude Code produced no review report."
          }
          $commit = (git rev-parse HEAD).Trim()
          $header = "# Claude Code read-only code audit" + [Environment]::NewLine + [Environment]::NewLine + "- Repository: $env:GITHUB_REPOSITORY" + [Environment]::NewLine + "- Commit: $commit" + [Environment]::NewLine + "- Model: $env:OLLAMA_CODING_MODEL" + [Environment]::NewLine + "- Mode: read-only; no source files may be changed" + [Environment]::NewLine + [Environment]::NewLine + "---" + [Environment]::NewLine + [Environment]::NewLine
          Set-Content -Path $reportPath -Value ($header + (Get-Content $logPath -Raw)) -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value (Get-Content $reportPath -Raw)

      - name: Verify the audit changed no repository files
        if: always() && steps.local_time_gate.outputs.proceed == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $status = @(git status --porcelain --untracked-files=all)
          if ($status.Count -gt 0) {
            throw "Read-only audit invariant violated; repository has changes: $($status -join '; ')"
          }
          Write-Host "Verified: checkout remains unchanged."

      - name: Upload read-only audit report and logs
        if: always() && steps.local_time_gate.outputs.proceed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-code-read-only-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/claude-code-review.md
            ${{ runner.temp }}/claude-code-agent.log
            ${{ runner.temp }}/claude-code-review-prompt.txt
          if-no-files-found: ignore
          retention-days: 14
