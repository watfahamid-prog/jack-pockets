name: Real narration smoke test

on:
  push:
    paths:
      - ".github/workflows/real-narration-smoke-test.yml"
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Branch or commit containing the narration fallback code"
        required: true
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  narration-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Checkout narration code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref || github.sha }}
          path: candidate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Python dependencies
        # Piper downloads the selected voice model automatically during the test if not cached.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install edge-tts requests python-dotenv openai piper-tts

      - name: Discover an available ElevenLabs voice when no voice ID is configured
        id: discover_voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ] || [ -n "$ELEVENLABS_VOICE_ID" ]; then
            echo "Skipping voice discovery (key missing or voice ID already configured)."
            exit 0
          fi
          python - <<'PY'
          import os
          import requests

          key = os.environ["ELEVENLABS_API_KEY"].strip()
          response = requests.get(
              "https://api.elevenlabs.io/v1/voices",
              headers={"xi-api-key": key},
              timeout=30,
          )
          if not response.ok:
              print(f"ElevenLabs voice discovery unavailable: HTTP {response.status_code}")
              raise SystemExit(0)
          voices = response.json().get("voices", [])
          if not voices:
              print("ElevenLabs returned no available voices.")
              raise SystemExit(0)
          chosen = next(
              (v for v in voices if v.get("name", "").lower() == "rachel"),
              next((v for v in voices if v.get("category") == "premade"), voices[0]),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write("voice_id=" + chosen["voice_id"] + "\n")
          print(f"Using available ElevenLabs voice for this test: {chosen.get('name', 'unnamed')}")
          PY

      - name: Generate and validate a short real narration sample
        working-directory: candidate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID || steps.discover_voice.outputs.voice_id }}
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_TTS_MODEL: gpt-4o-mini-tts
          OPENAI_TTS_VOICE: alloy
          TTS_VOICE: en-US-GuyNeural
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import tts

          out = Path("narration-smoke-test.mp3")
          sample = (
              "In nineteen ninety-seven, one small routing mistake showed "
              "how a single network announcement could disrupt internet traffic."
          )
          result = tts.synthesize(sample, out)
          if not result.exists() or result.stat().st_size < 1000:
              raise SystemExit("Narration output is missing or unexpectedly small")
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", str(out)],
              check=True, capture_output=True, text=True,
          )
          duration = float(probe.stdout.strip())
          if not 1.0 <= duration <= 30.0:
              raise SystemExit(f"Unexpected narration duration: {duration:.2f}s")
          subprocess.run(
              ["ffmpeg", "-v", "error", "-i", str(out), "-f", "null", "-"],
              check=True,
          )
          print(f"REAL_NARRATION_SMOKE_TEST_OK bytes={out.stat().st_size} duration={duration:.2f}s")
          PY

      - name: Upload narration sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-narration-smoke-test
          path: candidate/narration-smoke-test.mp3
          if-no-files-found: warn
          retention-days: 7
