name: Pipeline regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Test cache utility
        run: python -m unittest discover -s tests -p "test_cache_utils.py" -v

      - name: Test footage and research relevance
        run: python -m unittest discover -s tests -p "test_relevance.py" -v

      - name: Install client dependency for mocked Qwen provider test
        run: python -m pip install "openai>=1.40.0" "python-dotenv>=1.0.1"

      - name: Test Qwen provider without calling a model
        run: python -m unittest discover -s tests -p "test_qwen_provider.py" -v

      - name: Validate local Qwen smoke-test CLI
        run: python qwen_smoke_test.py --help
