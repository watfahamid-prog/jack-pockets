name: Jack Pockets real-project editor evaluation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Documentary topic to generate and test with both editors
        required: true
        type: string
        default: "What Is the Most Expensive Thing Ever?"
      preview_seconds:
        description: Preview duration in seconds (5–30)
        required: true
        type: number
        default: 20

permissions:
  contents: read

concurrency:
  group: jack-pockets-real-editor-evaluation
  cancel-in-progress: false

jobs:
  generate-and-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Jack Pockets
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libudev-dev ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Jack Pockets dependencies
        run: |
          npm install
          python -m pip install -r requirements.txt

      - name: Preflight and validate preview length
        env:
          PREVIEW_SECONDS: ${{ inputs.preview_seconds }}
        run: |
          python -m compileall -q .
          npm run typecheck
          python - <<'PY'
          import os
          n = float(os.environ["PREVIEW_SECONDS"])
          if not 5 <= n <= 30:
              raise SystemExit("preview_seconds must be between 5 and 30")
          PY

      - name: Generate real Jack Pockets project and manifest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_EDITOR_MODEL: ${{ secrets.GEMINI_EDITOR_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: eleven_multilingual_v2
          TTS_VOICE: en-US-GuyNeural
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          MUSIC_URL: ${{ secrets.MUSIC_URL }}
        run: |
          python generate.py --topic "${{ inputs.topic }}" --assets-per-beat 2 --no-render
          python - <<'PY'
          import json
          from pathlib import Path
          manifests = sorted(Path("public/runs").glob("*/manifest.json"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not manifests:
              raise SystemExit("Generation completed without a manifest")
          p = manifests[0]
          data = json.loads(p.read_text(encoding="utf-8"))
          if not data.get("beats") or not data.get("audioSrc"):
              raise SystemExit(f"Manifest is missing beats or narration: {p}")
          print(f"Using real manifest: {p}; beats={len(data['beats'])}; duration={data.get('duration')}")
          Path("editor-evaluation").mkdir(exist_ok=True)
          Path("editor-evaluation/manifest-path.txt").write_text(str(p), encoding="utf-8")
          PY

      - name: Checkout FilmCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          path: filmcraft-src

      - name: Checkout EffectCraft
        uses: actions/checkout@v4
        with:
          repository: storytold/effectcraft
          path: effectcraft-src

      - name: Cache editor builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            filmcraft-src
            effectcraft-src

      - name: Build FilmCraft CLI
        working-directory: filmcraft-src
        run: cargo build --release -p filmcraft-cli

      - name: Build EffectCraft CLI
        working-directory: effectcraft-src
        run: cargo build --release -p effectcraft-cli

      - name: Create FilmCraft preview from real manifest
        env:
          PREVIEW_SECONDS: ${{ inputs.preview_seconds }}
        run: |
          mkdir -p editor-evaluation/filmcraft
          MANIFEST="$(cat editor-evaluation/manifest-path.txt)"
          python filmcraft_bridge.py --manifest "$MANIFEST" --public-dir public --output-dir editor-evaluation/filmcraft --cli ./filmcraft-src/target/release/filmcraft-cli --max-seconds "$PREVIEW_SECONDS"

      - name: Create EffectCraft timeline from the same real manifest
        env:
          PREVIEW_SECONDS: ${{ inputs.preview_seconds }}
        run: |
          mkdir -p editor-evaluation/effectcraft
          MANIFEST="$(cat editor-evaluation/manifest-path.txt)"
          python effectcraft_bridge.py --manifest "$MANIFEST" --public-dir public --output editor-evaluation/effectcraft/jack-pockets.otio --max-seconds "$PREVIEW_SECONDS"
          ./effectcraft-src/target/release/effectcraft-cli exec file.importTimeline '{"path":"editor-evaluation/effectcraft/jack-pockets.otio"}' --empty --save-as editor-evaluation/effectcraft/jack-pockets.ecproj --json | tee editor-evaluation/effectcraft/import-result.json
          ./effectcraft-src/target/release/effectcraft-cli render editor-evaluation/effectcraft/jack-pockets.ecproj --out editor-evaluation/effectcraft/effectcraft-preview.mp4 --format h264 --start 0 --end "$PREVIEW_SECONDS" --fps 30 --audio on

      - name: Run audio, timing, stream and visual QA
        run: |
          python tests/validate_editor_preview.py editor-evaluation/filmcraft/filmcraft-manifest-preview.mp4 editor-evaluation/filmcraft/qa.json
          python tests/validate_editor_preview.py editor-evaluation/effectcraft/effectcraft-preview.mp4 editor-evaluation/effectcraft/qa.json

      - name: Upload real-project comparison and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jack-pockets-real-editor-comparison
          path: |
            editor-evaluation/
            public/runs/**/manifest.json
            public/runs/**/plan.json
            public/runs/**/research.json
            public/runs/**/alignment.json
            public/runs/**/narration.mp3
          if-no-files-found: warn
          retention-days: 14
