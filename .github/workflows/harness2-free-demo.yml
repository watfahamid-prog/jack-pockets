name: Harness² Free Demo (Isolated)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/harness2-free-demo.yml"
      - "harness2/**"
      - "requirements-harness2.txt"

permissions:
  contents: read

concurrency:
  group: harness2-free-demo
  cancel-in-progress: false

env:
  HARNESS2_COMMIT: 1cfe254e8d25b15f37048c3730134686abe60335

jobs:
  harness2-demo:
    name: Run credential-free Harness² demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Jack Pockets
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate Jack Pockets Harness² manifest
        run: python harness2/validate_harness.py

      - name: Fetch pinned Harness² into an isolated directory
        run: |
          git init harness2-upstream
          git -C harness2-upstream remote add origin https://github.com/google-research/harness2.git
          git -C harness2-upstream fetch --depth 1 origin "$HARNESS2_COMMIT"
          git -C harness2-upstream checkout --detach "$HARNESS2_COMMIT"

      - name: Install Harness² demo dependencies
        working-directory: harness2-upstream
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[render]'

      - name: Render Jack Pockets into Harness² native c1-c8 surface
        run: |
          python harness2/render_native_harness.py --output harness2/native

      - name: Validate native c1-c8 surface with pinned Harness²
        working-directory: harness2-upstream
        run: |
          ../harness2-upstream/.venv/bin/python - <<'PY'
          from pathlib import Path
          from harness2.core.tree import read_tree, validate
          from harness2.substrate.opencode import OPENCODE_SURFACE, compose_prompt

          root = Path("..") / "harness2" / "native"
          tree = read_tree(OPENCODE_SURFACE, root)
          census = validate(OPENCODE_SURFACE, tree, allow_subagents=True)
          compose_prompt(root)
          print("Validated Jack Pockets native Harness² surface:", census)
          PY

      - name: Run local demo without model credentials
        working-directory: harness2-upstream
        run: |
          .venv/bin/harness2-demo --output runs/jack-pockets-isolated-demo --k 2

      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness2-free-demo-${{ github.run_number }}
          path: |
            harness2-upstream/runs/jack-pockets-isolated-demo/**
          if-no-files-found: warn
          retention-days: 14
