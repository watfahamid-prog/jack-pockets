name: Harness² Free Demo (Isolated)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/harness2-free-demo.yml"
      - "harness2/**"
      - "requirements-harness2.txt"
      - "tests/test_harness2_agent_surfaces.py"

permissions:
  contents: read

concurrency:
  group: harness2-free-demo
  cancel-in-progress: false

env:
  HARNESS2_COMMIT: 1cfe254e8d25b15f37048c3730134686abe60335

jobs:
  harness2-demo:
    name: Run credential-free Harness² demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Jack Pockets
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Validate manifest and run focused tests
        run: |
          python harness2/validate_harness.py
          python -m unittest discover -s tests -p 'test_harness2_record_run.py' -v
          python -m unittest discover -s tests -p 'test_harness2_propose_improvements.py' -v
          python -m unittest discover -s tests -p 'test_harness2_agent_surfaces.py' -v

      - name: Render Claude Code and Codex instruction surfaces
        run: |
          printf '# Test evidence memory\n\nOverlay passed from CI.\n' > "$RUNNER_TEMP/harness2-memory.md"
          python harness2/render_native_harness.py --output harness2/native --memory "$RUNNER_TEMP/harness2-memory.md"
          test -s harness2/native/AGENTS.md
          test -s harness2/native/CLAUDE.md
          grep -q "Overlay passed from CI" harness2/native/AGENTS.md
          grep -q "Overlay passed from CI" harness2/native/CLAUDE.md
          test -d harness2/native/.agents/skills
          test -d harness2/native/.claude/skills

      - name: Fetch pinned Harness² into an isolated directory
        run: |
          git init harness2-upstream
          git -C harness2-upstream remote add origin https://github.com/google-research/harness2.git
          git -C harness2-upstream fetch --depth 1 origin "$HARNESS2_COMMIT"
          git -C harness2-upstream checkout --detach "$HARNESS2_COMMIT"

      - name: Install Harness² demo dependencies
        working-directory: harness2-upstream
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[render]'

      - name: Run local demo without model credentials
        working-directory: harness2-upstream
        run: |
          .venv/bin/harness2-demo --output runs/jack-pockets-isolated-demo --k 2

      - name: Upload demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness2-free-demo-${{ github.run_number }}
          path: |
            harness2-upstream/runs/jack-pockets-isolated-demo/**
            harness2/native/**
          if-no-files-found: warn
          retention-days: 14
