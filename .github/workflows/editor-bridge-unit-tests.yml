name: Editor bridge unit tests

on:
  push:
    branches:
      - improve/filmcraft-visual-validation
    paths:
      - "filmcraft_bridge.py"
      - "effectcraft_bridge.py"
      - "tests/test_filmcraft_bridge.py"
      - "tests/test_effectcraft_bridge.py"
      - ".github/workflows/editor-bridge-unit-tests.yml"
  pull_request:
    paths:
      - "filmcraft_bridge.py"
      - "effectcraft_bridge.py"
      - "tests/test_filmcraft_bridge.py"
      - "tests/test_effectcraft_bridge.py"
      - ".github/workflows/editor-bridge-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile adapters
        run: python -m py_compile filmcraft_bridge.py effectcraft_bridge.py
      - name: Test FilmCraft and EffectCraft adapters
        run: |
          python -m unittest discover -s tests -p 'test_filmcraft_bridge.py' -v
          python -m unittest discover -s tests -p 'test_effectcraft_bridge.py' -v
