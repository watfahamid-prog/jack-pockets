name: TTS fallback tests

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "tts.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tts-fallback-tests.yml"
  workflow_dispatch:

jobs:
  tts-fallback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run mocked TTS fallback tests
        run: python -m unittest tests.test_tts_fallbacks -v
