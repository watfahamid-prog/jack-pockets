name: Footage Matching Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "editorial_brain.py"
      - "quality.py"
      - "tests/**"
      - ".github/workflows/footage-tests.yml"
  push:
    branches:
      - main
      - "fix/sentence-footage-matching"
      - "polish/pre-major-changes"
    paths:
      - "editorial_brain.py"
      - "quality.py"
      - "tests/**"
      - ".github/workflows/footage-tests.yml"

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run footage, motion, timing, and quality regression tests
        run: |
          python -m unittest discover -s tests -p 'test_editorial_brain.py' -v
          python -m unittest discover -s tests -p 'test_motion_policy.py' -v
          python -m unittest discover -s tests -p 'test_quality.py' -v
          python -m unittest discover -s tests -p 'test_polish_guards.py' -v
